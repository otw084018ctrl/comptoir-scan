<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>COMPTOIR 相機掃描</title>
<style>
  :root {
    --over: #2a78d6; --good: #0ca30c; --warning: #fab219; --critical: #d03b3b;
    --ink: #ffffff; --ink-2: rgba(255,255,255,.72); --ink-muted: rgba(255,255,255,.5);
    --surface: rgba(20,20,20,.72); --line: rgba(255,255,255,.16);
    --radius-lg: 16px; --radius-md: 12px;
    --frame-h: clamp(92px, 30vh, 220px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; background: #000; color: var(--ink); }
  body { font: 15px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang TC", "Noto Sans TC", sans-serif;
    overflow: hidden; -webkit-font-smoothing: antialiased; }
  button, input { font: inherit; color: inherit; }

  /* 相機畫面填滿螢幕 */
  #video { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; background: #000; }

  .veil { position: fixed; inset: 0; box-shadow: inset 0 0 0 2000px rgba(0,0,0,.35); pointer-events: none; z-index: 2; }
  .frame { position: fixed; left: 8%; right: 8%; top: 50%; height: var(--frame-h); transform: translateY(-50%);
    border: 2.5px solid rgba(255,255,255,.9); border-radius: 18px; z-index: 3; pointer-events: none; transition: border-color .15s; }
  .frame.hit { border-color: var(--good); }
  .frame::before, .frame::after { content: ''; position: absolute; width: 28px; height: 28px; border-color: var(--over); border-style: solid; transition: border-color .15s; }
  .frame::before { left: -2.5px; top: -2.5px; border-width: 4px 0 0 4px; border-top-left-radius: 14px; }
  .frame::after { right: -2.5px; bottom: -2.5px; border-width: 0 4px 4px 0; border-bottom-right-radius: 14px; }
  .frame.hit::before, .frame.hit::after { border-color: var(--good); }
  .scanline { position: fixed; left: 10%; right: 10%; height: 2px; z-index: 3; top: calc(50% - var(--frame-h) / 2 + 6px);
    background: linear-gradient(90deg, transparent, var(--over), transparent); animation: sweep 2s ease-in-out infinite; pointer-events: none; }
  @keyframes sweep {
    0%, 100% { top: calc(50% - var(--frame-h) / 2 + 6px); }
    50% { top: calc(50% + var(--frame-h) / 2 - 6px); }
  }

  header { position: fixed; top: 0; left: 0; right: 0; z-index: 5; display: flex; align-items: center; justify-content: space-between;
    padding: calc(env(safe-area-inset-top) + 12px) 14px 12px; background: linear-gradient(rgba(0,0,0,.55), transparent); }
  .hdr-title { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 15px; }
  .hdr-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--good); box-shadow: 0 0 0 3px rgba(12,163,12,.3); animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .4; } }
  .hdr-sub { font-size: 12px; color: var(--ink-2); margin-top: 2px; }
  #closeBtn { width: 38px; height: 38px; border-radius: 50%; background: rgba(255,255,255,.16); border: 0; color: #fff;
    display: flex; align-items: center; justify-content: center; }
  #closeBtn svg { width: 18px; height: 18px; }

  .flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 4; }
  .flash.go { animation: flashgo .28s ease; }
  @keyframes flashgo { 0% { opacity: 0; } 25% { opacity: .5; } 100% { opacity: 0; } }

  .hint { position: fixed; left: 0; right: 0; z-index: 5; text-align: center; color: var(--ink-2); font-size: 13px; padding: 0 28px;
    top: calc(50% + var(--frame-h) / 2 + 16px); }

  /* 右側浮動工具列：手電筒 / 縮放 */
  .cam-tools { position: fixed; right: 14px; top: 50%; transform: translateY(-50%); z-index: 5; display: flex; flex-direction: column; gap: 10px; }
  .tool-btn { width: 44px; height: 44px; border-radius: 50%; background: var(--surface); border: 1px solid var(--line); color: #fff;
    display: flex; align-items: center; justify-content: center; backdrop-filter: blur(8px); font-size: 19px; font-weight: 700; }
  .tool-btn svg { width: 20px; height: 20px; }
  .tool-btn.on { background: var(--over); border-color: var(--over); }
  .capture-btn { background: var(--over); border-color: var(--over); width: 50px; height: 50px; }

  .center-msg { position: fixed; inset: 0; z-index: 6; display: none; align-items: center; justify-content: center; flex-direction: column;
    gap: 14px; padding: 32px; text-align: center; background: rgba(0,0,0,.55); }
  .center-msg.show { display: flex; }
  .center-msg svg { width: 40px; height: 40px; color: var(--warning); }
  .center-msg h2 { margin: 0; font-size: 17px; }
  .center-msg p { margin: 0; color: var(--ink-2); font-size: 13.5px; line-height: 1.6; max-width: 320px; }
  .center-msg button { margin-top: 6px; padding: 12px 22px; border-radius: 999px; border: 1px solid rgba(255,255,255,.35); background: rgba(255,255,255,.12); font-weight: 700; }

  .toast { position: fixed; left: 50%; top: 16%; transform: translateX(-50%); z-index: 6; display: flex; align-items: flex-start; gap: 8px;
    padding: 11px 16px; border-radius: 18px; font-size: 14px; font-weight: 700; opacity: 0; transition: opacity .18s; max-width: 84%; text-align: left; }
  .toast.show { opacity: 1; }
  .toast.ok { background: rgba(12,163,12,.94); }
  .toast.warn { background: rgba(250,178,25,.94); color: #241900; }
  .toast.bad { background: rgba(208,59,59,.94); }
  .toast svg { width: 15px; height: 15px; flex: none; margin-top: 2px; }
  .toast .ttxt { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .toast .tline1 { word-break: break-word; line-height: 1.3; }
  .toast .tline2 { font-size: 12.5px; font-weight: 600; opacity: .85; white-space: nowrap; }

  /* ---------- 最近掃描（快速撤銷）---------- */
  .recent-strip { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 8px; padding-bottom: 1px; -webkit-overflow-scrolling: touch; }
  .recent-strip::-webkit-scrollbar { display: none; }
  .recent-chip { flex: none; display: flex; align-items: center; gap: 6px; max-width: 44vw; background: var(--surface);
    border: 1px solid var(--line); border-radius: 999px; padding: 6px 6px 6px 12px; font-size: 12px; backdrop-filter: blur(8px); }
  .recent-chip.bad { border-color: rgba(208,59,59,.55); }
  .recent-chip .rc-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .recent-chip .rc-undo { flex: none; width: 21px; height: 21px; border-radius: 50%; background: rgba(255,255,255,.16);
    display: flex; align-items: center; justify-content: center; }
  .recent-chip .rc-undo svg { width: 10px; height: 10px; }

  .bottom { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; padding: 14px 14px calc(14px + env(safe-area-inset-bottom));
    background: linear-gradient(transparent, rgba(0,0,0,.6)); }
  .stats-row { display: flex; gap: 8px; margin-bottom: 10px; }
  .stat-pill { flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-md); padding: 9px 6px; text-align: center; backdrop-filter: blur(8px); }
  .stat-pill b { display: block; font-size: 18px; font-variant-numeric: tabular-nums; }
  .stat-pill span { font-size: 10.5px; color: var(--ink-2); }
  .manual-row { display: none; gap: 8px; margin-bottom: 10px; }
  .manual-row.show { display: flex; }
  #manualInput { flex: 1; padding: 13px 14px; border-radius: var(--radius-md); border: 1.5px solid var(--line); background: var(--surface);
    color: #fff; font-size: 16px; backdrop-filter: blur(8px); }
  #manualInput::placeholder { color: var(--ink-muted); }
  .action-row { display: flex; gap: 8px; }
  .action-row button { flex: 1; padding: 13px; border-radius: var(--radius-md); border: 1.5px solid var(--line); background: var(--surface);
    color: #fff; font-weight: 700; font-size: 14px; display: flex; align-items: center; justify-content: center; gap: 6px; backdrop-filter: blur(8px); }
  .action-row button svg { width: 16px; height: 16px; }
  .action-row button.on { background: var(--over); border-color: var(--over); }
  .sync-note { text-align: center; font-size: 11px; color: var(--ink-muted); margin-top: 8px; }
</style>
</head>
<body>

<video id="video" autoplay muted playsinline></video>
<div class="veil"></div>
<div class="frame"></div>
<div class="scanline"></div>
<div class="hint">請保持條碼「水平」並對準中心</div>
<div class="cam-tools" id="camTools">
  <button id="captureBtn" type="button" class="tool-btn capture-btn" title="精準拍照掃描"></button>
  <button id="torchBtn" type="button" class="tool-btn" hidden></button>
  <button id="zoomInBtn" type="button" class="tool-btn" hidden>﹢</button>
  <button id="zoomOutBtn" type="button" class="tool-btn" hidden>﹣</button>
</div>
<div class="flash" id="flash"></div>
<div class="toast" id="toast"></div>

<header>
  <div>
    <div class="hdr-title"><span class="hdr-dot"></span><span id="locLabel">相機掃描</span></div>
    <div class="hdr-sub" id="who"></div>
  </div>
  <button id="closeBtn" type="button"></button>
</header>

<div class="center-msg" id="centerMsg">
  <div id="centerIcon"></div>
  <h2 id="centerTitle">正在啟動相機…</h2>
  <p id="centerText">請允許瀏覽器使用相機權限</p>
  <button id="centerBtn" type="button" hidden></button>
</div>

<div class="bottom">
  <div class="recent-strip" id="recentStrip" hidden></div>
  <div class="stats-row">
    <div class="stat-pill"><b id="stTotal">0</b><span>這次已掃件數</span></div>
    <div class="stat-pill"><b id="stSku">0</b><span>款數</span></div>
    <div class="stat-pill" id="stPendBox"><b id="stPend">0</b><span>待同步</span></div>
  </div>
  <div class="manual-row" id="manualRow">
    <input id="manualInput" type="text" inputmode="text" placeholder="手動輸入條碼，按 Enter 送出" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
  </div>
  <div class="action-row">
    <button id="manualToggle" type="button"></button>
    <button id="doneBtn" type="button"></button>
  </div>
  <div class="sync-note" id="syncNote"></div>
  <div class="sync-note" id="debugNote">正在啟動相機…</div>
</div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var qs = new URLSearchParams(location.search);
  var BASE = qs.get('base') || '';
  var TOKEN = qs.get('token') || '';
  var LOC = qs.get('loc') || '';
  var WHO = qs.get('who') || '';
  var LABEL = qs.get('label') || LOC;

  var ICON = {
    check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
    warn:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.6 1.8 18a1 1 0 0 0 .9 1.5h18.6a1 1 0 0 0 .9-1.5L13.7 3.6a1 1 0 0 0-1.7 0Z"/><path d="M12 9v4M12 17h.01"/></svg>',
    cross: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>',
    keyboard: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M6 14h12"/></svg>',
    check2: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
    bolt: '<svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M13 2 3 14h7l-1 8 11-14h-7l0-6Z"/></svg>',
    camera: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l1.5-2h7L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1Z"/><circle cx="12" cy="13" r="3.4"/></svg>'
  };
  $('closeBtn').innerHTML = ICON.cross;
  $('manualToggle').innerHTML = ICON.keyboard + '<span>手動輸入</span>';
  $('doneBtn').innerHTML = ICON.check2 + '<span>完成，關閉</span>';
  $('torchBtn').innerHTML = ICON.bolt;
  $('captureBtn').innerHTML = ICON.camera;
  $('locLabel').textContent = LABEL + ' · 相機掃描';
  $('who').textContent = WHO ? ('盤點人：' + WHO) : '';

  function showCenter(iconKey, title, text, btnLabel, onBtn) {
    $('centerIcon').innerHTML = ICON[iconKey] || ICON.warn;
    $('centerTitle').textContent = title;
    $('centerText').textContent = text || '';
    var btn = $('centerBtn');
    if (btnLabel) { btn.hidden = false; btn.textContent = btnLabel; btn.onclick = onBtn; }
    else { btn.hidden = true; btn.onclick = null; }
    $('centerMsg').classList.add('show');
  }
  function hideCenter() { $('centerMsg').classList.remove('show'); }

  var S = { names: {}, stock: {}, counts: {}, queue: [], inflight: null, ready: false, lastCode: null, lastAt: 0, recent: [] };
  var LSKEY = 'camq_' + LOC;
  var LS = {
    get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };
  function clean(v) { return String(v == null ? '' : v).replace(/\*/g, '').trim(); }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

  var ac = null;
  function tone(freq, start, dur, type, gain) {
    var o = ac.createOscillator(), g = ac.createGain();
    o.connect(g); g.connect(ac.destination);
    o.type = type || 'sine'; o.frequency.setValueAtTime(freq, ac.currentTime + start);
    g.gain.setValueAtTime(0, ac.currentTime + start);
    g.gain.linearRampToValueAtTime(gain || 0.14, ac.currentTime + start + 0.01);
    g.gain.linearRampToValueAtTime(0, ac.currentTime + start + dur);
    o.start(ac.currentTime + start); o.stop(ac.currentTime + start + dur + 0.02);
  }
  function feedback(kind) {
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      if (ac.state === 'suspended') ac.resume();
      if (kind === 'ok') { tone(1046, 0, .07, 'sine', .13); tone(1568, .06, .09, 'sine', .11); }
      else if (kind === 'warn') { tone(660, 0, .1, 'triangle', .14); tone(660, .13, .1, 'triangle', .14); }
      else { tone(220, 0, .18, 'sawtooth', .11); }
    } catch (e) {}
    if (kind === 'warn' && navigator.vibrate) navigator.vibrate(60);
    if (kind === 'bad' && navigator.vibrate) navigator.vibrate([90, 60, 90]);
    if (kind === 'ok' && navigator.vibrate) navigator.vibrate(30);
  }

  function escapeHtml(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

  // line1（品名）獨立一行、太長會換行而不是被截斷看不到；
  // line2（應有／已掃數量）永遠完整顯示在自己的一行，不會被長品名擠到看不見。
  var toastTimer;
  function toast(kind, line1, line2) {
    var t = $('toast');
    t.className = 'toast show ' + kind;
    var html = (kind === 'ok' ? ICON.check : kind === 'warn' ? ICON.warn : ICON.cross) +
      '<span class="ttxt"><span class="tline1">' + escapeHtml(line1) + '</span>';
    if (line2) html += '<span class="tline2">' + escapeHtml(line2) + '</span>';
    html += '</span>';
    t.innerHTML = html;
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.className = 'toast'; }, 1600);
  }

  function render() {
    var total = 0, sku = 0;
    for (var c in S.counts) { if (S.counts[c] > 0) { total += S.counts[c]; sku++; } }
    $('stTotal').textContent = total; $('stSku').textContent = sku;
    var pend = S.queue.length + (S.inflight ? S.inflight.length : 0);
    $('stPend').textContent = pend;
    $('stPendBox').style.color = pend > 0 ? '#fab219' : '';
    renderRecent();
  }

  /* ---------- 最近掃描（這個 session 內）＋快速撤銷 ---------- */
  var RECENT_MAX = 6;
  function pushRecent(item) {
    S.recent.unshift(item);
    if (S.recent.length > RECENT_MAX) S.recent.length = RECENT_MAX;
  }
  function removeFromRecent(id) {
    S.recent = S.recent.filter(function (r) { return r.id !== id; });
  }
  function renderRecent() {
    var box = $('recentStrip');
    if (!S.recent.length) { box.hidden = true; box.innerHTML = ''; return; }
    box.hidden = false;
    box.innerHTML = S.recent.map(function (r) {
      return '<div class="recent-chip' + (r.known === false ? ' bad' : '') + '">' +
        '<span class="rc-name">' + escapeHtml(r.name) + '</span>' +
        '<button type="button" class="rc-undo" data-id="' + escapeHtml(r.id) + '">' + ICON.cross + '</button>' +
        '</div>';
    }).join('');
  }
  function findById(arr, id) {
    if (!arr) return -1;
    for (var i = 0; i < arr.length; i++) if (arr[i].id === id) return i;
    return -1;
  }
  // 快速撤銷：還沒送出的直接從本地佇列拿掉；已經送出但還在等回應的，標記等回應後再撤銷；
  // 已經同步到伺服器的，直接呼叫伺服器的 undoScan——三種情況都可能發生，取決於網路快慢。
  function undoRecent(id) {
    var item = S.recent.filter(function (r) { return r.id === id; })[0];
    if (!item) return;
    var qi = findById(S.queue, id);
    if (qi >= 0) {
      S.queue.splice(qi, 1);
      S.counts[item.code] = Math.max(0, (S.counts[item.code] || 1) - 1);
      persist(); removeFromRecent(id); render();
      return;
    }
    var ii = findById(S.inflight, id);
    if (ii >= 0) {
      S.inflight[ii].undone = true;
      S.counts[item.code] = Math.max(0, (S.counts[item.code] || 1) - 1);
      removeFromRecent(id); render();
      return;
    }
    apiPost({ token: TOKEN, action: 'undoScan', id: id }).then(function () {
      S.counts[item.code] = Math.max(0, (S.counts[item.code] || 1) - 1);
      removeFromRecent(id); render();
      toast('warn', '已撤銷', item.name);
    }).catch(function (e) {
      toast('bad', '撤銷失敗', (e && e.message) || '請再試一次');
    });
  }
  $('recentStrip').addEventListener('click', function (e) {
    var btn = e.target.closest('.rc-undo');
    if (!btn) return;
    undoRecent(btn.getAttribute('data-id'));
  });

  function persist() { LS.set(LSKEY, JSON.stringify(S.queue.concat(S.inflight || []))); }
  function apiPost(payload) {
    if (!BASE) return Promise.resolve({});
    return fetch(BASE, { method: 'POST', body: JSON.stringify(payload) })
      .then(function (r) { return r.json(); })
      .then(function (j) { if (!j.ok) throw new Error(j.error || '伺服器回傳失敗'); return j.data; });
  }
  function apiGet(action, extra) {
    if (!BASE) return Promise.resolve({});
    var u = BASE + '?action=' + action + '&token=' + encodeURIComponent(TOKEN) + '&loc=' + encodeURIComponent(LOC) + (extra || '');
    return fetch(u).then(function (r) { return r.json(); }).then(function (j) { if (!j.ok) throw new Error(j.error || '伺服器回傳失敗'); return j.data; });
  }

  function flush() {
    if (!BASE || S.inflight || !S.queue.length) return;
    var batch = S.queue.splice(0, 50);
    S.inflight = batch; render();
    apiPost({ token: TOKEN, action: 'appendScans', user: WHO, scans: batch.map(function (x) { return { id: x.id, t: x.t, loc: x.loc, code: x.code, name: x.name }; }) })
      .then(function () {
        var b = S.inflight; S.inflight = null;
        // 已經送出去才按撤銷的（快速撤銷點在資料還在飛的時候），這裡補送一次真正的撤銷
        b.forEach(function (x) { if (x.undone) apiPost({ token: TOKEN, action: 'undoScan', id: x.id }); });
        persist(); render(); flush();
      })
      .catch(function () {
        var b = S.inflight.filter(function (x) { return !x.undone; });
        S.queue = b.concat(S.queue); S.inflight = null;
        persist(); render(); toast('bad', '同步失敗，將自動重試'); setTimeout(flush, 4000);
      });
  }

  function onHit(raw) {
    var code = clean(raw);
    if (!code) return;
    var now = Date.now();
    if (code === S.lastCode && now - S.lastAt < 1500) return;
    S.lastCode = code; S.lastAt = now;

    var flash = $('flash'); flash.classList.remove('go'); void flash.offsetWidth; flash.classList.add('go');

    if (!BASE) {
      toast('ok', '測試掃描成功', code);
      feedback('ok');
      return;
    }

    var name = S.names[code];
    var known = !!name;
    S.counts[code] = (S.counts[code] || 0) + 1;
    var scan = { id: uid(), t: now, loc: LOC, code: code, name: name || '庫存表無此條碼' };
    S.queue.push(scan); persist(); flush();
    pushRecent({ id: scan.id, code: code, name: scan.name, known: known, t: now });
    render();

    if (!name) {
      toast('bad', '查無此條碼', code);
      feedback('bad');
      return;
    }
    var need = S.stock[code] || 0, got = S.counts[code];
    var kind = got > need ? 'warn' : 'ok';
    toast(kind, name, '應有 ' + need + '／已掃 ' + got);
    feedback(kind);
  }

  /* ---------- 掃碼引擎：原生 BarcodeDetector（優先）／ZXing-WASM（備援） ---------- */
  var ZXING_VER = '3.1.4';
  var ZXING_PKG = 'https://cdn.jsdelivr.net/npm/zxing-wasm@' + ZXING_VER + '/';
  var ZXING_ENTRY = ZXING_PKG + 'dist/es/reader/index.js'; // 套件的 ESM 進入點
  var ZXING_WASM_DIR = ZXING_PKG + 'dist/reader/'; // .wasm 檔實際放的資料夾（跟 es/reader 不同層）
  var ZXING_FORMATS = ['Code128', 'Code39', 'EAN-13', 'EAN-8', 'UPC-A', 'UPC-E', 'ITF', 'Codabar'];

  var mediaStream = null, activeTrack = null, rafId = null, usingVfc = false, nativeDetector = null, isScanning = false;
  var zxingLoadPromise = null;

  // padded = true 時，解碼範圍會比畫面上看到的白框稍微再大一圈，
  // 讓條碼沒有完全對準框線時也還是掃得到（連續掃描用小一點的框求快，
  // 拍照掃描用大一點的框求容錯）。
  function frameRectCss(padded) {
    var vw = window.innerWidth, vh = window.innerHeight;
    var h = Math.max(92, Math.min(vh * 0.30, 220));
    var w = vw * 0.84;
    if (padded) { w = Math.min(vw * 0.97, w * 1.18); h = Math.min(vh * 0.9, h * 1.5); }
    var x = (vw - w) / 2;
    var y = (vh - h) / 2;
    return { x: x, y: y, w: w, h: h, vw: vw, vh: vh };
  }

  // 把畫面裁切成「只剩下白框裡（或稍微再大一圈）的區域」再拿去解碼，而不是整張相機畫面。
  // 要反推 object-fit: cover 的縮放/置中位移，才能正確對應回原始畫面像素座標。
  // source 可以是 <video> 也可以是拍照後的 ImageBitmap，只要有寬高即可。
  function cropSourceToFrame(source, srcW, srcH, canvas, ctx, padded) {
    var rect = frameRectCss(padded);
    if (!srcW || !srcH || !rect.vw || !rect.vh) return false;
    var scale = Math.max(rect.vw / srcW, rect.vh / srcH);
    var dispW = srcW * scale, dispH = srcH * scale;
    var offX = (dispW - rect.vw) / 2, offY = (dispH - rect.vh) / 2;
    var sx = (rect.x + offX) / scale;
    var sy = (rect.y + offY) / scale;
    var sw = rect.w / scale;
    var sh = rect.h / scale;
    sx = Math.max(0, sx); sy = Math.max(0, sy);
    sw = Math.min(sw, srcW - sx); sh = Math.min(sh, srcH - sy);
    if (sw <= 4 || sh <= 4) return false;
    canvas.width = sw; canvas.height = sh;
    ctx.drawImage(source, sx, sy, sw, sh, 0, 0, sw, sh);
    return true;
  }

  function cropToFrame(video, canvas, ctx) {
    return cropSourceToFrame(video, video.videoWidth, video.videoHeight, canvas, ctx, false);
  }

  function decodeSource(canvas, ctx) {
    if (nativeDetector) {
      return nativeDetector.detect(canvas).then(function (codes) {
        return codes && codes.length ? codes[0].rawValue : null;
      });
    }
    var imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    return decodeWithZxing(imageData).then(function (results) {
      return results && results.length ? results[0].text : null;
    });
  }

  // 手動「精準拍照」：給連續掃描抓不到的疑難條碼多一個機會——
  // 拍一張畫質更好、範圍容錯更大的照片，讓使用者可以停下來仔細對準再試一次。
  // 有支援 ImageCapture 的手機（多為 Android）可以拿到比錄影畫面更高解析度的原始照片；
  // iPhone Safari 目前沒有 ImageCapture，會退回用當下這一幀畫面，但仍受益於「較大容錯範圍＋不趕時間仔細解碼」。
  function capturePhotoAndDecode() {
    if (!mediaStream) return;
    var track = mediaStream.getVideoTracks()[0];
    showCenter('warn', '拍照中…', '請保持條碼在框內、手不要動');

    var getBitmap;
    if (window.ImageCapture && track) {
      try {
        var ic = new window.ImageCapture(track);
        getBitmap = ic.takePhoto().then(function (blob) { return createImageBitmap(blob); });
      } catch (e) { getBitmap = createImageBitmap($('video')); }
    } else {
      getBitmap = createImageBitmap($('video'));
    }

    getBitmap.then(function (bitmap) {
      var canvas = document.createElement('canvas');
      var ctx = canvas.getContext('2d', { willReadFrequently: true });
      var ok = cropSourceToFrame(bitmap, bitmap.width, bitmap.height, canvas, ctx, true);
      if (bitmap.close) bitmap.close();
      if (!ok) { hideCenter(); toast('warn', '拍照失敗，請再試一次'); return null; }
      return decodeSource(canvas, ctx);
    }).then(function (text) {
      hideCenter();
      if (text) onHit(text);
      else if (text !== null) toast('warn', '拍照後仍辨識不到，請調整距離、角度或光線再試');
    }).catch(function (e) {
      hideCenter();
      toast('bad', '拍照失敗：' + ((e && e.message) || e));
    });
  }

  function hideCamTools() {
    $('torchBtn').hidden = true; $('torchBtn').classList.remove('on');
    $('zoomInBtn').hidden = true; $('zoomOutBtn').hidden = true;
  }

  function setupCameraControls(track) {
    hideCamTools();
    try {
      var caps = track.getCapabilities ? track.getCapabilities() : {};
      if (caps.torch) {
        var torchOn = false;
        $('torchBtn').hidden = false;
        $('torchBtn').onclick = function () {
          torchOn = !torchOn;
          track.applyConstraints({ advanced: [{ torch: torchOn }] }).catch(function () {});
          $('torchBtn').classList.toggle('on', torchOn);
        };
      }
      if (caps.zoom && caps.zoom.min != null && caps.zoom.max != null) {
        var min = caps.zoom.min, max = caps.zoom.max, step = caps.zoom.step || 0.5, cur = min;
        $('zoomInBtn').hidden = false; $('zoomOutBtn').hidden = false;
        $('zoomInBtn').onclick = function () { cur = Math.min(max, cur + step); track.applyConstraints({ advanced: [{ zoom: cur }] }).catch(function () {}); };
        $('zoomOutBtn').onclick = function () { cur = Math.max(min, cur - step); track.applyConstraints({ advanced: [{ zoom: cur }] }).catch(function () {}); };
      }
    } catch (e) {}
  }

  function stopCamera() {
    isScanning = false;
    hideCamTools();
    if (rafId) {
      var video = $('video');
      if (usingVfc && video.cancelVideoFrameCallback) { try { video.cancelVideoFrameCallback(rafId); } catch (e) {} }
      else cancelAnimationFrame(rafId);
    }
    rafId = null;
    activeTrack = null;
    if (mediaStream) { mediaStream.getTracks().forEach(function (t) { t.stop(); }); mediaStream = null; }
  }

  function cameraFailed() {
    showCenter('warn', '無法開啟相機', '請確認已允許相機權限，或改用下方「手動輸入」。', '改用手動輸入', function () {
      hideCenter(); $('manualRow').classList.add('show'); $('manualToggle').classList.add('on'); $('manualInput').focus();
    });
  }

  function loadZxingWasm() {
    if (zxingLoadPromise) return zxingLoadPromise;
    zxingLoadPromise = import(ZXING_ENTRY).then(function (mod) {
      mod.prepareZXingModule({
        overrides: { locateFile: function (path) { return path.endsWith('.wasm') ? (ZXING_WASM_DIR + path) : path; } }
      });
      window.__zxingReadBarcodes = mod.readBarcodes;
      return mod;
    });
    return zxingLoadPromise;
  }

  function decodeWithZxing(imageData) {
    return window.__zxingReadBarcodes(imageData, { formats: ZXING_FORMATS, tryHarder: true, maxNumberOfSymbols: 1 })
      .catch(function () {
        // 保底：萬一格式名稱跟目前套件版本對不上，改用不限格式再試一次，至少不會整個失效
        return window.__zxingReadBarcodes(imageData, { tryHarder: true, maxNumberOfSymbols: 1 });
      });
  }

  var frameHitTimer;
  function flashFrameHit() {
    var f = document.querySelector('.frame');
    f.classList.add('hit');
    clearTimeout(frameHitTimer);
    frameHitTimer = setTimeout(function () { f.classList.remove('hit'); }, 220);
  }

  function loopDetect() {
    var video = $('video');
    var canvas = document.createElement('canvas');
    var ctx = canvas.getContext('2d', { willReadFrequently: true });
    var busy = false, lastTry = 0;
    var engineLabel = nativeDetector ? '瀏覽器原生' : 'ZXing-WASM（高精度）';
    // requestVideoFrameCallback 在有支援的手機上，會準確地在「相機真的吐出新一幀」時才觸發，
    // 比單純的 requestAnimationFrame（跟畫面更新頻率綁在一起、不管相機幀是否更新）更有效率。
    usingVfc = !!video.requestVideoFrameCallback;
    isScanning = true;
    function schedule(fn) {
      if (usingVfc) rafId = video.requestVideoFrameCallback(fn);
      else rafId = requestAnimationFrame(fn);
    }
    (function tick() {
      if (!isScanning) return;
      var now = performance.now();
      if (!busy && video.readyState >= 2 && now - lastTry > 150) {
        if (cropToFrame(video, canvas, ctx)) {
          lastTry = now; busy = true;
          decodeSource(canvas, ctx).then(function (text) {
            if (text) { flashFrameHit(); onHit(text); }
            $('debugNote').textContent = '引擎：' + engineLabel + '　畫面 ' + video.videoWidth + '×' + video.videoHeight;
          }).catch(function (e) {
            $('debugNote').textContent = '解碼發生錯誤：' + ((e && e.message) || e);
          }).then(function () { busy = false; });
        }
      }
      schedule(tick);
    })();
  }

  function startZxingPath() {
    nativeDetector = null;
    $('debugNote').textContent = '正在載入高精度掃碼引擎…';
    loadZxingWasm().then(function () { loopDetect(); }).catch(function (e) {
      $('debugNote').textContent = '掃碼引擎載入失敗：' + ((e && e.message) || e);
      showCenter('warn', '掃碼引擎載入失敗', '請檢查網路連線後重新整理頁面，或改用下方「手動輸入」。', '改用手動輸入', function () {
        hideCenter(); $('manualRow').classList.add('show'); $('manualToggle').classList.add('on'); $('manualInput').focus();
      });
    });
  }

  function tryNativeThenLoop() {
    if (!('BarcodeDetector' in window)) { startZxingPath(); return; }
    try {
      window.BarcodeDetector.getSupportedFormats().then(function (supported) {
        supported = supported || [];
        var want = ['code_128', 'code_39', 'ean_13', 'ean_8', 'upc_a', 'upc_e', 'itf', 'codabar'];
        var use = want.filter(function (f) { return supported.indexOf(f) !== -1; });
        try {
          nativeDetector = use.length ? new window.BarcodeDetector({ formats: use }) : new window.BarcodeDetector();
          loopDetect();
        } catch (e) { startZxingPath(); }
      }).catch(function () { startZxingPath(); });
    } catch (e) { startZxingPath(); }
  }

  function startCamera() {
    showCenter('warn', '正在啟動相機…', '請允許瀏覽器使用相機權限');

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      showCenter('warn', '此瀏覽器不支援相機', '請改用下方「手動輸入」，或用掃描槍搭配主頁面。');
      $('manualRow').classList.add('show'); $('manualToggle').classList.add('on');
      return;
    }

    navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: 'environment' },
        width: { ideal: 1920 },
        height: { ideal: 1080 }
      }
    }).then(function (stream) {
      mediaStream = stream;
      var video = $('video');
      video.srcObject = stream;
      var p = video.play(); if (p && p.catch) p.catch(function () {});
      hideCenter();

      var track = stream.getVideoTracks()[0];
      activeTrack = track;
      try {
        var caps = track.getCapabilities ? track.getCapabilities() : {};
        var advanced = [];
        if (caps.focusMode && caps.focusMode.indexOf('continuous') !== -1) advanced.push({ focusMode: 'continuous' });
        if (caps.exposureMode && caps.exposureMode.indexOf('continuous') !== -1) advanced.push({ exposureMode: 'continuous' });
        if (caps.whiteBalanceMode && caps.whiteBalanceMode.indexOf('continuous') !== -1) advanced.push({ whiteBalanceMode: 'continuous' });
        if (advanced.length) track.applyConstraints({ advanced: advanced }).catch(function () {});
      } catch (e) {}
      setupCameraControls(track);

      tryNativeThenLoop();
    }).catch(function () { cameraFailed(); });
  }

  // 點畫面對焦：手指點想對焦的位置，跟一般相機 App 的操作習慣一樣。
  // 部分手機（尤其 iOS Safari）不支援 pointsOfInterest，會被 catch 靜默吃掉，不影響其他功能。
  $('video').addEventListener('click', function (e) {
    if (!activeTrack) return;
    var r = e.target.getBoundingClientRect();
    var x = (e.clientX - r.left) / r.width;
    var y = (e.clientY - r.top) / r.height;
    x = Math.min(1, Math.max(0, x)); y = Math.min(1, Math.max(0, y));
    activeTrack.applyConstraints({ advanced: [{ pointsOfInterest: [{ x: x, y: y }] }] }).catch(function () {});
  });

  $('captureBtn').onclick = capturePhotoAndDecode;

  $('manualToggle').onclick = function () {
    var on = $('manualRow').classList.toggle('show');
    $('manualToggle').classList.toggle('on', on);
    if (on) $('manualInput').focus();
  };
  $('manualInput').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); var v = $('manualInput').value; $('manualInput').value = ''; onHit(v); }
  });
  $('manualInput').addEventListener('input', function () {
    var el = $('manualInput');
    var v = el.value;
    var cleaned = v.replace(/[^\x00-\x7F]/g, '');
    if (cleaned !== v) el.value = cleaned;
  });

  $('closeBtn').onclick = $('doneBtn').onclick = function () {
    stopCamera();
    if (S.queue.length || S.inflight) {
      $('doneBtn').disabled = true;
      var tries = 0;
      (function wait() {
        flush();
        if ((!S.queue.length && !S.inflight) || tries++ > 30) { window.close(); setTimeout(function () { location.href = 'about:blank'; }, 300); }
        else setTimeout(wait, 300);
      })();
    } else {
      window.close(); setTimeout(function () { location.href = 'about:blank'; }, 300);
    }
  };

  document.addEventListener('visibilitychange', function () {
    if (document.hidden) {
      stopCamera();
    } else {
      if (!isScanning) startCamera();
    }
  });

  window.addEventListener('beforeunload', function (e) {
    if (S.queue.length || S.inflight) { e.preventDefault(); e.returnValue = ''; }
  });

  try { S.queue = JSON.parse(LS.get(LSKEY) || '[]') || []; } catch (e) { S.queue = []; }

  if (BASE) {
    apiGet('scanBootstrap').then(function (data) {
      S.names = data.names || {}; S.stock = data.stock || {}; S.counts = data.counts || {};
      S.queue.concat(S.inflight || []).forEach(function (x) { S.counts[x.code] = (S.counts[x.code] || 0) + 1; });
      S.ready = true; render();
      $('syncNote').textContent = '已與伺服器同步';

      // 如果是重新打開這個頁面（同一輪盤點中途離開又回來），把伺服器上這個區域
      // 最近幾筆掃描紀錄補回「最近掃描」清單，這樣「快速撤銷」也還能用。
      apiGet('recentScans', '&limit=' + RECENT_MAX).then(function (rows) {
        (rows || []).forEach(function (r) {
          if (findById(S.recent, r.id) >= 0) return;
          S.recent.push({ id: r.id, code: r.code, name: r.name || S.names[r.code] || '庫存表無此條碼', known: !!S.names[r.code], t: r.t });
        });
        S.recent.sort(function (a, b) { return b.t - a.t; });
        if (S.recent.length > RECENT_MAX) S.recent.length = RECENT_MAX;
        render();
      }).catch(function () {});

      startCamera();
      flush();

      setInterval(function () {
        if (!document.hidden) {
          apiGet('counts').then(function (serverCounts) {
            var merged = {};
            Object.keys(serverCounts || {}).forEach(function (c) { merged[c] = serverCounts[c]; });
            S.queue.concat(S.inflight || []).forEach(function (x) { merged[x.code] = (merged[x.code] || 0) + 1; });
            S.counts = merged; render();
            $('syncNote').textContent = '已與伺服器同步';
          }).catch(function () {});
        }
      }, 20000);
    }).catch(function (e) {
      showCenter('warn', '連線失敗', (e && e.message) || '無法連上盤點系統，請確認網路連線後重新整理頁面。');
    });
  } else {
    // 沒參數就純開相機測試
    startCamera();
  }
})();
</script>
</body>
</html>
